services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tradio
      POSTGRES_PASSWORD: tradio
      POSTGRES_DB: tradio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradio"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
