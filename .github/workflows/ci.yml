# Tests on every push and PR; a Docker image for every push that passes.
# Image tags (docker/metadata-action):
#   every push       ashutoshsao/tradio:<full commit sha>
#   git tag v2.0.0   also :2.0.0  (a pre-release tag v2.0.0-rc.1 gives :2.0.0-rc.1)
#   main             also :latest
# Deployments in the ops repo pin a version or sha, never :latest, so a rollback is a tag change.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tradio
          POSTGRES_PASSWORD: tradio
          POSTGRES_DB: tradio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradio" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Test
        run: uv run --frozen pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tradio:tradio@localhost:5432/tradio_test

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ashutoshsao/tradio
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # GKE nodes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
